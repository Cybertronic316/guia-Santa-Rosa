<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
 <link rel="icon" type="image/png" href="img/favicon.png">
    
    <title>Colectivos</title>
 
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    <style>
        .header-naranja { background: linear-gradient(70deg, #0d2043, #010101 100%);  padding: 50px 20px 80px 20px; text-align: center; position: relative; color: white; }
        .ola-blanca { position: absolute; bottom: 0; left: 0; width: 100%; line-height: 0; }
        .card-destino { background: white; border-radius: 25px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        /* Estilo para la sección FIJA */
        .seccion-fija { background: white; border-radius: 25px; margin-bottom: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; }

        #modalZoom {
            display: none; 
            position: fixed; 
            top: 0; left: 0;
            width: 100%; height: 100%; 
            background: #000;
            z-index: 99999; 
            touch-action: none;
        }

        .btn-cerrar-x {
            position: absolute; top: 20px; right: 20px;
            width: 45px; height: 45px; background: rgba(0,0,0,0.5);
            color: white; border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-size: 24px; z-index: 100001; border: 1px solid rgba(255,255,255,0.5);
        }

        #panzoom-parent {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        #imgZoomed {
            width: 100vw;
            height: auto;
            display: block;
        }
    </style>
</head>
<body class="bg-slate-50">

    <header class="header-naranja">
        <a href="index.html" class="absolute top-5 left-5 bg-white/10 backdrop-blur-md px-4 py-2 rounded-full text-[10px] font-black text-white uppercase tracking-tighter border border-white/20">
            <i class="fas fa-chevron-left mr-1"></i> Inicio
        </a>
        <h1 class="text-3xl font-black text-[#369a9a] uppercase italic tracking-tighter">Colectivos</h1>
        <div class="ola-blanca">
            <svg viewBox="0 0 500 150" preserveAspectRatio="none" style="height: 40px; width: 100%;"><path d="M0.00,49.98 C150.00,150.00 348.20,-49.98 500.00,49.98 L500.00,150.00 L0.00,150.00 Z" style="fill: #f8fafc;"></path></svg>
        </div>
    </header>

    <main class="px-5 -mt-8 relative z-10 pb-10">
        
        <section class="seccion-fija">
            <h2 class="flex items-center gap-2 font-black text-slate-800 uppercase mb-4 text-sm tracking-wide">
                <i class="fas fa-map-marker-alt text-[#369a9a]"></i> 📍 Santa Rosa - Merlo
            </h2>
            
            <div class="space-y-3">
                <button onclick="abrirZoom('img/colectivos/panaholma.jpg')" class="w-full text-left bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-sm active:scale-[0.98] transition-transform">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="font-black text-slate-700 uppercase">PANAHOLMA</p>
                            <p class="text-xs text-green-600 font-bold italic">Boleto: $1.500</p>
                        </div>
                        <span class="text-[10px] bg-[#369a9a] text-white px-3 py-1 rounded-lg font-bold uppercase shadow-sm">Ver Horarios</span>
                    </div>
                </button>

                <button onclick="abrirZoom('img/colectivos/panamericana.jpg')" class="w-full text-left bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-sm active:scale-[0.98] transition-transform">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="font-black text-slate-700 uppercase">PANAMERICANA</p>
                            <p class="text-xs text-green-600 font-bold italic">Boleto: $1.500</p>
                        </div>
                        <span class="text-[10px] bg-[#369a9a] text-white px-3 py-1 rounded-lg font-bold uppercase shadow-sm">Ver Horarios</span>
                    </div>
                </button>

                <button onclick="abrirZoom('img/colectivos/travel.jpg')" class="w-full text-left bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-sm active:scale-[0.98] transition-transform">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="font-black text-slate-700 uppercase">TRAVEL SUR</p>
                            <p class="text-xs text-green-600 font-bold italic">Boleto: $1.500</p>
                        </div>
                        <span class="text-[10px] bg-[#369a9a] text-white px-3 py-1 rounded-lg font-bold uppercase shadow-sm">Ver Horarios</span>
                    </div>
                </button>

            </div>
        </section>

        <h3 class="px-2 mb-3 text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">Otros Destinos</h3>

        <details class="card-destino group">
            <summary class="p-5 flex justify-between items-center cursor-pointer list-none font-black text-slate-800 uppercase text-sm">
                <span>📍 Santa Rosa - San Luis</span>
                <i class="fas fa-chevron-down text-[#369a9a] group-open:rotate-180 transition-transform"></i>
            </summary>
            <div class="p-4 bg-slate-50 border-t space-y-3">
                <button onclick="abrirZoom('img/san-luis.jpg')" class="w-full text-left bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="font-black text-slate-700 uppercase text-xs">Blanca Paloma</p>
                            <p class="text-[10px] text-green-600 font-bold italic">Consultar Tarifa</p>
                        </div>
                        <span class="text-[9px] border border-[#369a9a] text-[#369a9a] px-3 py-1 rounded-lg font-bold">HORARIOS</span>
                    </div>
                </button>
            </div>
        </details>

    </main>

    <div id="modalZoom">
        <div class="btn-cerrar-x" onclick="cerrarZoom()">
            <i class="fas fa-times"></i>
        </div>
        <div id="panzoom-parent">
            <img id="imgZoomed" src="">
        </div>
    </div>

    <script>
        const imgElement = document.getElementById('imgZoomed');
        const modal = document.getElementById('modalZoom');
        let pz;

        pz = Panzoom(imgElement, {
            maxScale: 5,
            minScale: 1,
            contain: 'outside',
            startScale: 1
        });

        imgElement.parentElement.addEventListener('wheel', pz.zoomWithWheel);

        function abrirZoom(ruta) {
            imgElement.src = ruta;
            imgElement.onload = function() {
                modal.style.display = 'block';
                setTimeout(() => {
                    pz.reset();
                    pz.pan(0, 0); 
                }, 50);
            };
            imgElement.onerror = function() {
                if(imgElement.src !== "" && !imgElement.src.includes(window.location.href)) {
                   alert("Imagen de horario no disponible por el momento.");
                   cerrarZoom();
                }
            };
        }

        function cerrarZoom() {
            modal.style.display = 'none';
            imgElement.onerror = null;
            imgElement.src = ""; 
        }
    </script>
</body>
</html>

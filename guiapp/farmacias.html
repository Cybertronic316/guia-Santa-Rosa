<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
 <link rel="icon" type="image/png" href="img/favicon.png">

    <title>Farmacias de Turno</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .header-naranja {
            background: linear-gradient(70deg, #0d2043, #010101 100%); 
            padding: 50px 20px 80px 20px;
            text-align: center;
            position: relative;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }
        .circulo-icono {
            width: 90px; height: 90px; background: white; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 45px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin-bottom: 15px;
        }
        .volver-btn {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 20px;
            text-decoration: none; color: white; font-weight: bold; font-size: 13px;
        }
        .ola-blanca { position: absolute; bottom: 0; left: 0; width: 100%; line-height: 0; }
        .card-farmacia {
            background: white; border-radius: 30px; padding: 30px;
            box-shadow: 0 15px 30px rgba(255, 69, 0, 0.1); border: 1px solid #ffe0cc; text-align: center;
        }
    </style>
</head>
<body class="bg-slate-50">

    <header class="header-naranja">
        <a href="index.html" class="absolute top-5 left-5 bg-white/10 backdrop-blur-md px-4 py-2 rounded-full text-[10px] font-black text-white uppercase tracking-tighter border border-white/20">
            <i class="fas fa-chevron-left mr-1"></i> Inicio
        </a>
    
        <h1 class="text-3xl font-black tracking-tight text-[#369a9a] uppercase">Farmacias</h1>
        <div class="ola-blanca">
            <svg viewBox="0 0 500 150" preserveAspectRatio="none" style="height: 50px; width: 100%;">
                <path d="M0.00,49.98 C150.00,150.00 348.20,-49.98 500.00,49.98 L500.00,150.00 L0.00,150.00 Z" style="fill: #f8fafc;"></path>
            </svg>
        </div>
    </header>
<main class="px-6 -mt-10 relative z-10">
    <div id="resultado-farmacia" class="card-farmacia">
        </div>

    <div class="mt-10">
        <h3 class="text-slate-800 font-black text-lg mb-4 flex items-center gap-2">
            <span class="bg-orange-500 w-2 h-6 rounded-full"></span>
            TODAS LAS FARMACIAS
        </h3>

        <div class="space-y-4 p-4">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
        <div>
            <h4 class="font-bold text-slate-800">Farmacia Quintana</h4>
            <p class="text-xs text-slate-500">Rivadavia y Hipólito Irigoyen</p>
        </div>
        <div class="bg-green-500 p-3 rounded-full text-white flex items-center justify-center w-12 h-12 shadow-sm">
            <span class="text-2xl font-bold leading-none">+</span>
        </div>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
        <div>
            <h4 class="font-bold text-slate-800">Farmacia Curi</h4>
            <p class="text-xs text-slate-500">Rivadavia</p>
        </div>
        <div class="bg-green-500 p-3 rounded-full text-white flex items-center justify-center w-12 h-12 shadow-sm">
            <span class="text-2xl font-bold leading-none">+</span>
        </div>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
        <div>
            <h4 class="font-bold text-slate-800">Farmacia Rivadavia</h4>
            <p class="text-xs text-slate-500">9 de Julio</p>
        </div>
        <div class="bg-green-500 p-3 rounded-full text-white flex items-center justify-center w-12 h-12 shadow-sm">
            <span class="text-2xl font-bold leading-none">+</span>
        </div>
    </div>
</div>
</main>

<script>
    // Mantenemos la lógica de la semana para el cuadro de arriba
    function obtenerSemanaDelAno() {
        const hoy = new Date();
        const primeroDeEnero = new Date(hoy.getFullYear(), 0, 1);
        const dias = Math.floor((hoy - primeroDeEnero) / (24 * 60 * 60 * 1000));
        return Math.ceil((dias + primeroDeEnero.getDay() + 1) / 7);
    }

    function mostrarTurnoSemanal() {
        const numeroSemana = obtenerSemanaDelAno();
        const contenedor = document.getElementById('resultado-farmacia');
        const rotacion = numeroSemana % 3; 

        let farmacia = ""; let tel = ""; let dir = "";

        if (rotacion === 0) {
            farmacia = "Farmacia Quintana"; dir = "Rivadavia y Hipolito Irigoyen";
        } else if (rotacion === 1) {
            farmacia = "Farmacia Curi"; dir = "Rivadavia";
        } else {
            farmacia = "Farmacia Rivadavia"; dir = "9 de Julio";
        }

        contenedor.innerHTML = `
            <span class="bg-green-100 text-green-700 text-[10px] font-bold px-3 py-1 rounded-full uppercase">Abierta Ahora (Turno)</span>
            <h3 class="text-2xl font-black text-slate-800 mt-4 mb-1">${farmacia}</h3>
            <p class="text-slate-500 text-sm mb-6">${dir}</p>
            <p class="block bg-orange-500 text-white py-4 rounded-2xl font-bold shadow-lg shadow-orange-200 active:scale-95 transition-all text-lg">
                Hoy de TURNO
            </a>
        `;
    }
    window.onload = mostrarTurnoSemanal;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Pizzerías</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    <style>
        .header-rojo { background: linear-gradient(70deg, #0d2043, #010101 100%);  padding: 40px 20px; text-align: center; color: white; position: relative; border-radius: 0 0 40px 40px; }
        
        .card-local { background: white; border-radius: 30px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; border: 1px solid #f1f5f9; }
        
        /* Botones */
        .btn-menu { background: #3b82f6; color: white; padding: 12px; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; text-decoration: none; margin-bottom: 10px; width: 100%; }
        .btn-wa { background: #25D366; color: white; padding: 12px; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; text-decoration: none; width: 100%; }

        /* Modal Zoom Nivel 4 */
        #modalZoom { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 99999; overflow: hidden; touch-action: none; }
        .btn-cerrar-x { position: absolute; top: 30px; right: 25px; width: 50px; height: 50px; background: rgba(0,0,0,0.5); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; z-index: 100001; border: 2px solid rgba(255,255,255,0.5); }
        #panzoom-parent { width: 100vw; height: 100vh; display: flex; align-items: flex-start; justify-content: center; }
        #imgZoomed { width: 100vw; height: auto; display: block; }
    </style>
</head>
<body class="bg-slate-50">

    <header class="header-rojo shadow-lg">
        <a href="https://guiasantarosa.netlify.app/delivery.html" class="absolute top-5 left-5 bg-white/10 backdrop-blur-md px-4 py-2 rounded-full text-[10px] font-black text-white uppercase tracking-tighter border border-white/20">
            <i class="fas fa-chevron-left mr-1"></i> Inicio
        </a>
       
        <h1 class="text-3xl font-black text-[#369a9a] uppercase italic tracking-tighter">Pizzerías</h1>
    </header>

    <main class="p-6">
        <div class="card-local">
            <img src="logo_pizzeria.jpg" class="w-20 h-20 rounded-full mx-auto mb-3 border-2 border-rose-500 shadow-sm">
            <h3 class="font-black text-xl text-slate-800 uppercase italic">La Especial</h3>
            <p class="text-[10px] text-slate-400 font-bold mb-4 uppercase tracking-widest">Las mejores pizzas a la piedra</p>
            
            <button onclick="abrirZoom('menu_la_especial.jpg')" class="btn-menu uppercase">
                <i class="fas fa-book-open"></i> Ver Menú / Precios
            </button>

            <a href="https://wa.me/5492664000000?text=Hola!%20Vengo%20de%20la%20App,%20quiero%20hacer%20un%20pedido" class="btn-wa uppercase">
                <i class="fab fa-whatsapp text-xl"></i> Pedir por WhatsApp
            </a>
        </div>
    </main>

    <div id="modalZoom">
        <div class="btn-cerrar-x" onclick="cerrarZoom()">
            <i class="fas fa-times"></i>
        </div>
        <div id="panzoom-parent">
            <img id="imgZoomed" src="">
        </div>
    </div>

    <script>
        const imgElement = document.getElementById('imgZoomed');
        const modal = document.getElementById('modalZoom');
        let pz = Panzoom(imgElement, { maxScale: 5, minScale: 1, contain: 'outside', startScale: 1 });

        imgElement.parentElement.addEventListener('wheel', pz.zoomWithWheel);

        function abrirZoom(ruta) {
            imgElement.src = ruta;
            imgElement.onload = function() {
                modal.style.display = 'block';
                setTimeout(() => { pz.reset(); pz.pan(0, 0); }, 50);
            };
            imgElement.onerror = function() {
                if(imgElement.src !== "") { alert("Error: No se encontró la foto del menú."); cerrarZoom(); }
            };
        }

        function cerrarZoom() {
            modal.style.display = 'none';
            imgElement.onerror = null;
            imgElement.src = ""; 
        }
    </script>
</body>
</html>
